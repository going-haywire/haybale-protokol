[[haybales]]
name = "haybale-protokol"
label = "Protokol"
version = "0.0.4"
require = "haywire-core>=0.5.1"
description = "Control protocols for graphs: gates, shared lines and the base for OSC, MIDI and gamepad"
source = "pypi"
install_spec = "haybale-protokol==0.0.4"
tags = [ "osc", "midi", "gamepad", "control", "protocol",]
on_reload = "none"
origin = "https://github.com/going-haywire/haybale-protokol"
origin_provider = "github"
notes = "NOTES.md"

[[haybales]]
name = "haybale-protokol-osc"
label = "Protokol OSC"
version = "0.0.4"
require = "haywire-core>=0.5.1"
description = "OSC for haybale-protokol: UDP and TCP gates, OSC Receive and Send nodes"
source = "pypi"
install_spec = "haybale-protokol-osc==0.0.4"
tags = [ "osc", "control", "protocol", "network",]
on_reload = "none"
linked_libraries = [ "haybale_protokol", "haybale_core",]
origin = "https://github.com/going-haywire/haybale-protokol"
origin_provider = "github"
notes = "NOTES.md"

