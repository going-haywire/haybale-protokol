[project]
name = "haybale-protokol-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.6.0", "haybale-studio>=0.6.0", "haybale-marketplace>=0.6.0", "haybale-core>=0.6.0", "haybale-graph-editor>=0.6.0", "haybale-haystack>=0.6.0", "haybale-protokol", "haybale-protokol-osc", "haybale-protokol-midi", "haybale-protokol-gamepad",]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haybale-protokol]
workspace = true

[tool.uv.sources.haybale-protokol-osc]
workspace = true

[tool.uv.sources.haybale-protokol-midi]
workspace = true

[tool.uv.sources.haybale-protokol-gamepad]
workspace = true

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "../haywire-repo/barn/haybale-haystack"
editable = true

[dependency-groups]
# pytest-timeout 1.x imports distutils, which Python 3.12 dropped.
dev = ["pytest>=8", "pytest-timeout>=2.0", "ruff==0.12.12", "mypy==2.1.0"]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
extend-select = ["E501", "PT", "B", "TID251", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"haywire.core".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."
"haywire.ui".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."
"haywire.barn".msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."

[tool.ruff.lint.per-file-ignores]
# Tests reach into the framework to set it up; the ban is for the libraries.
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = ["integration: needs the full library system"]

[tool.haywire.marketstall]
distribute = "pypi"

[tool.haywire.agents]
# The docs folder whose `serve: developer` pages the Farmhand bridge serves to agent
# sessions here: core's, through the core clone beside this repository.
developer-docs = "../haywire-repo/docs"
