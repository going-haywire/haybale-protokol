# Full field reference: docs/reference/files/pyproject-toml.md
[project]
# ── generated from haybale.toml at publish; hand-edits are reported as drift ─
name = "haybale-protokol-midi"  # from haybale.name
description = "MIDI for haybale-protokol: Device gates, MIDI Event and Send MIDI nodes"  # from haybale.description
keywords = ["midi", "control", "protocol", "device"]  # from haybale.tags

# CANON, but owned by the release machinery — synced to haybale.toml
version = "0.0.9"

# ── authored here ────────────────────────────────────────────────────────────
requires-python = ">=3.12"
license = {text = "MIT"}

# CANON — pip requirements. Add third-party packages and sibling haybales here.
dependencies = [
    "haywire-core>=0.6.0",
    "haybale-core>=0.6.0",
    "haybale-protokol",
    # 1.5.7 is the first with Python 3.12 wheels; older ones build from source (C++, ALSA headers).
    "python-rtmidi>=1.5.7",
    "mido>=1.2.0",  # Message.from_bytes arrived in 1.2.0
]

# The key is the entry-point name (unique within the group; need not match the
# library id). The value is <module>:<class>.
[project.entry-points."haywire.libraries"]
haybale-protokol-midi = "haybale_protokol_midi:Library"

[project.urls]
Source = "https://github.com/going-haywire/haybale-protokol"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declares the package DIRECTORY, so everything not VCS-ignored inside it
# reaches the wheel, including haybale.toml — do not add include/exclude here.
[tool.hatch.build.targets.wheel]
packages = ["haybale_protokol_midi"]
