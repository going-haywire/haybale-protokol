# Full field reference: docs/reference/files/pyproject-toml.md
[project]
# ── generated from haybale.toml at publish; hand-edits are reported as drift ─
name = "haybale-protokol"  # from haybale.name
description = "Control protocols for graphs: gates, shared lines and the base for OSC, MIDI and gamepad"  # from haybale.description
keywords = ["osc", "midi", "gamepad", "control", "protocol"]  # from haybale.tags

# CANON, but owned by the release machinery — synced to haybale.toml
version = "0.0.9"

# ── authored here ────────────────────────────────────────────────────────────
requires-python = ">=3.12"
license = {text = "MIT"}

# CANON — pip requirements. Add third-party packages and sibling haybales here.
dependencies = ["haywire-core>=0.6.0", "nicegui>=3.18.0", "tomlkit>=0.13"]

# The key is the entry-point name (unique within the group; need not match the
# library id). The value is <module>:<class>.
[project.entry-points."haywire.libraries"]
haybale-protokol = "haybale_protokol:Library"

[project.urls]
Source = "https://github.com/going-haywire/haybale-protokol"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declares the package DIRECTORY, so everything not VCS-ignored inside it
# reaches the wheel, including haybale.toml — do not add include/exclude here.
[tool.hatch.build.targets.wheel]
packages = ["haybale_protokol"]
