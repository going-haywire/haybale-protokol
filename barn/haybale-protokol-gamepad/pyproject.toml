# Full field reference: docs/reference/files/pyproject-toml.md
[project]
# ── generated from haybale.toml at publish; hand-edits are reported as drift ─
name = "haybale-protokol-gamepad"  # from haybale.name
description = "Gamepads for haybale-protokol: Device gates, Gamepad Event and Send Rumble nodes"  # from haybale.description
keywords = ["gamepad", "game controller", "control", "protocol", "device"]  # from haybale.tags

# CANON, but owned by the release machinery — synced to haybale.toml
version = "0.0.9"

# ── authored here ────────────────────────────────────────────────────────────
requires-python = ">=3.12"
license = {text = "MIT"}

# CANON — pip requirements. Add third-party packages and sibling haybales here.
dependencies = [
    "haywire-core>=0.6.5",
    "haybale-core>=0.6.0",
    "haybale-protokol",
    # 0.9.8 added SDL_HINT_GAMECONTROLLER_USE_BUTTON_LABELS and SDL_HINT_JOYSTICK_THREAD.
    "pysdl2>=0.9.8",
    # SDL 2.0.22, the first with a macOS universal2 (Apple Silicon) wheel and the joystick-thread hint.
    "pysdl2-dll>=2.0.22.post1",
    "nicegui",
]

# The key is the entry-point name (unique within the group; need not match the
# library id). The value is <module>:<class>.
[project.entry-points."haywire.libraries"]
haybale-protokol-gamepad = "haybale_protokol_gamepad:Library"

[project.urls]
Source = "https://github.com/going-haywire/haybale-protokol"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declares the package DIRECTORY, so everything not VCS-ignored inside it
# reaches the wheel, including haybale.toml — do not add include/exclude here.
[tool.hatch.build.targets.wheel]
packages = ["haybale_protokol_gamepad"]
